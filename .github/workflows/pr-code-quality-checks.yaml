name: PR Code Quality Checks
run-name: "${{ github.actor }} is running workflow against commit: ${{ github.sha }}"
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-code-quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mise install
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true
          cache: true

      - name: Go install
        run: mise run install

      - name: Run Go checks
        run: mise run test-all

      - name: Run Terraform / OpenTofu checks
        run: mise run tf-plan-all
